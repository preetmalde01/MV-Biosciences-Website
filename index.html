<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Malde Ventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --orange-start: #e86a24;
      --orange-end: #d44218;
      --text-main: #f1f5f9;
      --text-dim: #79879c;
      --font-brand: 'Montserrat', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed Canvas for live interactive matrix */
    #live-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(9, 11, 16, 0.78) 100%);
    }

    /* Viewport Layout */
    .viewport {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3.5rem 2rem;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Center Hero Section */
    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      max-width: 640px;
      width: 100%;
    }

    .logo-hero-svg {
      width: 250px;
      height: auto;
      max-width: 82vw;
      margin-bottom: 1.25rem;
      filter: drop-shadow(0 6px 22px rgba(232, 106, 36, 0.3));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-hero-svg:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 8px 30px rgba(232, 106, 36, 0.45));
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ea7a32;
      font-weight: 600;
      margin-bottom: 2rem;
      background: rgba(232, 106, 36, 0.08);
      border: 1px solid rgba(232, 106, 36, 0.25);
      padding: 0.38rem 0.95rem;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ea7a32;
      box-shadow: 0 0 10px #ea7a32;
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Inquiry Form */
    .inquiry-wrap {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }

    .inquiry-form {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 0.35rem 0.4rem 0.35rem 1.25rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .inquiry-form:focus-within {
      border-color: #ea7a32;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 24px rgba(232, 106, 36, 0.22);
    }

    .inquiry-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .inquiry-input::placeholder {
      color: #5d6b7e;
      font-weight: 300;
    }

    .inquiry-btn {
      background: linear-gradient(135deg, var(--orange-start) 0%, var(--orange-end) 100%);
      color: #ffffff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .inquiry-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(232, 106, 36, 0.35);
    }

    /* Clean Minimalist Footer */
    footer {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8125rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .footer-city {
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: #6c7c91;
    }

    @media (max-width: 640px) {
      .viewport { padding: 2.25rem 1.25rem; }
      .logo-hero-svg { width: 215px; margin-bottom: 1rem; }
      .status-badge { margin-bottom: 1.75rem; font-size: 0.7rem; }
      footer {
        flex-direction: row;
        justify-content: space-between;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Live Matrix Canvas Background -->
  <canvas id="live-canvas"></canvas>
  <div class="vignette"></div>

  <div class="viewport">
    
    <div></div> <!-- Top balance spacing -->

    <!-- Center Hero Section -->
    <main class="brand-hero">
      
      <!-- Mountain Summit Master Logo Vector -->
      <svg class="logo-hero-svg interactive" viewBox="0 0 320 210" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="summitGradHero" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E86A24"/>
            <stop offset="45%" stop-color="#ED5A24"/>
            <stop offset="100%" stop-color="#D44218"/>
          </linearGradient>
        </defs>
        
        <!-- Peak Ridges -->
        <g transform="translate(10, 10)">
          <!-- Primary High Peak (Left-Center) -->
          <path d="M 60 115 L 140 35 L 205 100" 
                stroke="url(#summitGradHero)" 
                stroke-width="12" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
                
          <!-- Secondary Peak (Right) -->
          <path d="M 175 70 L 195 50 L 260 115" 
                stroke="url(#summitGradHero)" 
                stroke-width="12" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
                
          <!-- Inner Ridge (Nested lower peak) -->
          <path d="M 110 115 L 145 80 L 180 115" 
                stroke="url(#summitGradHero)" 
                stroke-width="12" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
        </g>

        <!-- Typography: MALDE VENTURES -->
        <text x="160" y="186" 
              font-family="'Montserrat', sans-serif" 
              font-size="22" 
              font-weight="800" 
              letter-spacing="4.5" 
              fill="#FFFFFF" 
              text-anchor="middle">MALDE VENTURES</text>
      </svg>

      <div class="status-badge">
        <span class="pulse-dot"></span>
        Platform In Development
      </div>

      <!-- Clean Inquiry Input Form -->
      <div class="inquiry-wrap interactive">
        <form class="inquiry-form" id="inquiry-form" onsubmit="handleInquiry(event)">
          <input type="email" name="email" class="inquiry-input" id="email-field" placeholder="Enter corporate email" required autocomplete="email">
          <button type="submit" class="inquiry-btn" id="inquiry-btn">Notify Me</button>
        </form>
      </div>

    </main>

    <!-- Clean Footer -->
    <footer>
      <span class="footer-city">Mumbai &bull; Global Operations</span>
      <div>&copy; 2026 Malde Ventures</div>
    </footer>

  </div>

  <!-- High-Performance Interactive Matrix Engine -->
  <script>
    (function() {
      const canvas = document.getElementById('live-canvas');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      let dpr = 1;
      let nodes = [];

      const mouse = {
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0,
        radius: 180,
        active: false
      };

      function updateDimensions() {
        width = window.innerWidth || document.documentElement.clientWidth || screen.width || 390;
        height = window.innerHeight || document.documentElement.clientHeight || screen.height || 844;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        if (!mouse.active) {
          mouse.x = mouse.targetX = width / 2;
          mouse.y = mouse.targetY = height / 2;
        }
      }

      class MatrixNode {
        constructor(initial) {
          this.reset(initial);
        }

        reset(initial) {
          this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? 0 : width);
          this.y = initial ? Math.random() * height : Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.44;
          this.vy = (Math.random() - 0.5) * 0.44;
          
          const isMobile = width < 768;
          this.radius = isMobile ? (Math.random() * 1.8 + 1.2) : (Math.random() * 1.5 + 0.9);
          this.baseAlpha = isMobile ? (Math.random() * 0.45 + 0.35) : (Math.random() * 0.4 + 0.2);
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < -10) this.x = width + 10;
          if (this.x > width + 10) this.x = -10;
          if (this.y < -10) this.y = height + 10;
          if (this.y > height + 10) this.y = -10;

          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < mouse.radius && dist > 0) {
            const force = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            this.x -= Math.cos(angle) * force * 1.7;
            this.y -= Math.sin(angle) * force * 1.7;
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(232, 106, 36, ${this.baseAlpha})`;
          ctx.fill();
        }
      }

      function initNodes() {
        updateDimensions();
        nodes = [];
        const isMobile = width < 768;
        const targetCount = isMobile ? 42 : 68;

        for (let i = 0; i < targetCount; i++) {
          nodes.push(new MatrixNode(true));
        }
      }

      function animate() {
        mouse.x += (mouse.targetX - mouse.x) * 0.08;
        mouse.y += (mouse.targetY - mouse.y) * 0.08;

        ctx.clearRect(0, 0, width, height);

        const isMobile = width < 768;
        const maxDist = isMobile ? 112 : 128;
        const len = nodes.length;

        // Draw inter-node connective filaments
        for (let i = 0; i < len; i++) {
          const ni = nodes[i];
          for (let j = i + 1; j < len; j++) {
            const nj = nodes[j];
            const dx = ni.x - nj.x;
            const dy = ni.y - nj.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDist) {
              const alpha = (1 - dist / maxDist) * (isMobile ? 0.26 : 0.18);
              ctx.beginPath();
              ctx.moveTo(ni.x, ni.y);
              ctx.lineTo(nj.x, nj.y);
              ctx.strokeStyle = `rgba(232, 106, 36, ${alpha})`;
              ctx.lineWidth = isMobile ? 0.9 : 0.65;
              ctx.stroke();
            }
          }
        }

        // Draw cursor/touch interactive connections
        for (let i = 0; i < len; i++) {
          const n = nodes[i];
          const dx = mouse.x - n.x;
          const dy = mouse.y - n.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < mouse.radius) {
            const alpha = (1 - dist / mouse.radius) * 0.35;
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(245, 176, 65, ${alpha})`;
            ctx.lineWidth = isMobile ? 1.0 : 0.8;
            ctx.stroke();
          }

          n.update();
          n.draw();
        }

        requestAnimationFrame(animate);
      }

      // Input Event Handlers
      window.addEventListener('mousemove', function(e) {
        mouse.targetX = e.clientX;
        mouse.targetY = e.clientY;
        mouse.active = true;
      }, { passive: true });

      window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 0) {
          mouse.targetX = mouse.x = e.touches[0].clientX;
          mouse.targetY = mouse.y = e.touches[0].clientY;
          mouse.active = true;
        }
      }, { passive: true });

      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 0) {
          mouse.targetX = e.touches[0].clientX;
          mouse.targetY = e.touches[0].clientY;
          mouse.active = true;
        }
      }, { passive: true });

      let resizeTimeout;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
          const newW = window.innerWidth || screen.width;
          const newH = window.innerHeight || screen.height;
          if (Math.abs(newW - width) > 40 || Math.abs(newH - height) > 80) {
            initNodes();
          }
        }, 150);
      }, { passive: true });

      window.addEventListener('orientationchange', function() {
        setTimeout(initNodes, 250);
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          initNodes();
          animate();
        });
      } else {
        initNodes();
        animate();
      }

    })();

    async function handleInquiry(e) {
      e.preventDefault();
      const input = document.getElementById('email-field');
      const btn = document.getElementById('inquiry-btn');
      const wrap = document.querySelector('.inquiry-wrap');
      const email = input.value.trim();

      if (!email) return;

      btn.textContent = 'Sending...';
      btn.disabled = true;

      try {
        await fetch('https://formsubmit.co/ajax/preet@maldeventures.com', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            _subject: 'New Malde Ventures Launch Inquiry',
            _captcha: 'false',
            _template: 'table'
          })
        });
      } catch (err) {
        console.warn('Submission dispatched:', err);
      }

      wrap.innerHTML = `
        <div style="font-size: 0.875rem; color: #ea7a32; letter-spacing: 0.05em; padding: 0.65rem 0;">
          Inquiry registered for <strong>${email}</strong>.
        </div>
      `;
    }
  </script>
</body>
</html>
